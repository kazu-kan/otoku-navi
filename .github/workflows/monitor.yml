# 毎朝8時（日本時間）にキャンペーンを確認し、新着・締切・対象店の変更をスマホに通知する
name: キャンペーン監視

on:
  schedule:
    - cron: "0 23 * * *"   # UTC 23:00 = 日本時間 8:00（GitHubの混雑で数十分遅れることがあります）
  workflow_dispatch:        # Actions画面の「Run workflow」で手動実行もできる

permissions:
  contents: write

concurrency: monitor

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: キャンペーンを確認して通知
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python monitor/monitor.py

      - name: 結果を保存（アプリが読むデータを更新）
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/campaigns.json monitor/state.json
          git diff --cached --quiet || git commit -m "キャンペーン情報を更新 $(TZ=Asia/Tokyo date +%F)"
          git push
